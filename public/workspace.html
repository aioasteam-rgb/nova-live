<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GAMA Suite - Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --navy:#0b1437; --orange:#f26522; --soft:#c9d0e6; --line:#d9deea; --bg:#f4f6fb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: var(--navy); }
  .wrap { display:grid; grid-template-rows: 48px 1fr 38px; height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--navy); border-bottom:3px solid var(--orange); }
  .brand { font-weight:800; font-size:20px; color:#fff; } .brand b { color:var(--orange); }
  .now { color:var(--soft); font-size:15px; max-width:60%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { background:var(--orange); color:#fff; font-weight:700; font-size:13px; padding:5px 12px; border-radius:20px; }
  .pill::before { content:""; display:inline-block; width:8px; height:8px; background:#fff; border-radius:50%; margin-right:7px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.2 } }
  main { display:grid; grid-template-columns: 1fr 260px; min-height:0; background:#fff; }
  .view { position:relative; background:var(--bg); }
  .view iframe { position:absolute; inset:0; width:100%; height:100%; border:0; pointer-events:none; }
  .wait { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--navy); }
  .spin { width:42px; height:42px; border:4px solid var(--line); border-top-color:var(--orange); border-radius:50%; animation: s 1s linear infinite; margin-bottom:14px; }
  @keyframes s { to { transform: rotate(360deg) } }
  aside { border-left:1px solid var(--line); padding:14px; overflow:hidden; background:#fbfcfe; }
  aside h3 { margin:0 0 10px; font-size:14px; color:var(--navy); }
  .st { display:flex; gap:8px; align-items:flex-start; font-size:13px; color:#1d2433; margin-bottom:8px; line-height:1.3; }
  .dot { width:9px; height:9px; border-radius:2px; margin-top:4px; flex:none; background:#8a8f99; }
  .done .dot { background:#1a8f4c } .doing .dot { background:var(--orange) } .stopped .dot, .error .dot { background:#c0392b }
  .instruction { font-weight:700; color:var(--navy) } .detail { color:#5b6478; font-size:12px }
  footer { display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--bg); border-top:1px solid var(--line); font-size:13px; color:#1d2433; }
  footer b { color:var(--navy) }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>GAMA</b> Suite</div>
    <div class="now" id="now">Ready for your instructions</div>
    <div class="pill" id="portal">LIVE</div>
  </header>
  <main>
    <div class="view">
      <div class="wait" id="wait"><div class="spin"></div><div>Preparing the live system...</div></div>
      <iframe id="lv" sandbox="allow-same-origin allow-scripts" allow="clipboard-read; clipboard-write" title="Live view"></iframe>
    </div>
    <aside><h3>Steps</h3><div id="steps"></div></aside>
  </main>
  <footer><span id="instr">Say what you would like Nova to do.</span><b>Presented by Nova</b></footer>
</div>
<script>
let shown = null;
async function tick() {
  try {
    const r = await fetch('/v1/workspace/current', { cache: 'no-store' });
    const d = await r.json();
    if (d.liveViewUrl && d.liveViewUrl !== shown) {
      shown = d.liveViewUrl;
      document.getElementById('lv').src = d.liveViewUrl;
      document.getElementById('wait').style.display = 'none';
    }
    document.getElementById('portal').textContent = 'LIVE  ' + (d.portal || 'GAMA Suite');
    const c = d.current;
    if (c) {
      document.getElementById('instr').textContent = 'Instruction: "' + c.instruction + '"';
      document.getElementById('now').textContent = c.status === 'running' ? 'Working live...' : (c.summary || c.status);
    }
    const box = document.getElementById('steps');
    box.innerHTML = (d.steps || []).slice(-12).map(s =>
      '<div class="st ' + s.kind + '"><span class="dot"></span><span>' +
      String(s.text).replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[m])) + '</span></div>').join('');
  } catch (e) {}
}
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
