<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nova Operator Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; background:#f4f6fb; color:#1d2433; }
  header { background:#0b1437; color:#fff; padding:14px 22px; font-weight:700; font-size:18px; border-bottom:3px solid #f26522; }
  main { max-width:980px; margin:20px auto; display:grid; grid-template-columns: 1fr 1fr; gap:18px; padding:0 16px; }
  section { background:#fff; border:1px solid #d9deea; border-radius:8px; padding:16px; }
  h2 { font-size:15px; margin:0 0 12px; color:#0b1437; }
  label { display:block; font-size:12px; color:#5b6478; margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:8px; border:1px solid #d9deea; border-radius:6px; font:inherit; box-sizing:border-box; }
  button { margin-top:12px; padding:9px 14px; border:0; border-radius:6px; font-weight:700; cursor:pointer; background:#f26522; color:#fff; }
  button.alt { background:#0b1437 } button.red { background:#c0392b }
  pre { background:#0b1437; color:#dfe5f5; padding:12px; border-radius:6px; height:300px; overflow:auto; font-size:12px; }
  .full { grid-column: 1 / -1; }
  a { color:#f26522 }
</style>
</head>
<body>
<header>Nova Operator Console</header>
<main>
  <section>
    <h2>1. Browser</h2>
    <label>Admin token</label><input id="tok" type="password" placeholder="ADMIN_TOKEN from Render">
    <label>Start in portal</label>
    <select id="portal"><option value="admin">Admin Portal</option><option value="crm">CRM Portal</option><option value="customer">Customer Portal</option></select>
    <button onclick="call('/v1/console/start',{portal:val('portal')})">Start browser and log in</button>
    <button class="red" onclick="call('/v1/console/end',{})">Close browser</button>
    <p style="font-size:12px;color:#5b6478">Live Workspace for Nova's screen share: <a id="ws" href="/workspace" target="_blank">/workspace</a></p>
  </section>
  <section>
    <h2>2. Test an instruction (without Nova)</h2>
    <label>Instruction</label>
    <textarea id="instr" rows="3">Open Request Freight Quote, choose Sea, set customer SHIPNER, origin Houston, destination Port Klang</textarea>
    <button onclick="call('/v1/console/run',{portal:val('portal'),instruction:val('instr')})">Run live</button>
    <button class="red" onclick="call('/v1/console/stop',{})">Stop</button>
  </section>
  <section class="full">
    <h2>3. One-time setup: create Nova's tools in Tavus</h2>
    <button class="alt" onclick="call('/setup',{})">Create and attach tools</button>
    <h2 style="margin-top:16px">Log</h2>
    <pre id="log"></pre>
  </section>
</main>
<script>
const val = id => document.getElementById(id).value;
function out(x) { const p = document.getElementById('log'); p.textContent = (typeof x === 'string' ? x : JSON.stringify(x, null, 2)) + '\n' + p.textContent; }
async function call(path, body) {
  out('-> ' + path);
  try {
    const r = await fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-token': val('tok') }, body: JSON.stringify(body) });
    out(await r.json());
  } catch (e) { out('error ' + e.message); }
}
setInterval(async () => {
  if (!val('tok')) return;
  try { const r = await fetch('/v1/console/log', { headers: { 'x-admin-token': val('tok') } }); if (r.ok) { const d = await r.json(); document.title = 'Nova Console - ' + (d.log.slice(-1)[0] || ''); } } catch (e) {}
}, 3000);
</script>
</body>
</html>
